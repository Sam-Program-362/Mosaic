# Build-machine memory budget.
#
# The default Gradle heap (2 GB) plus a separate Kotlin compile daemon exceeds a
# 2 GB/1 CPU machine and the OS out-of-memory killer terminates the build. The
# settings below keep everything in one JVM and size it to fit. Raise these only
# if the build machine has more memory.
org.gradle.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

# Compile Kotlin inside the Gradle daemon instead of forking a second JVM.
kotlin.compiler.execution.strategy=in-process
# Only used if a Kotlin daemon is started anyway, so it cannot exhaust the machine.
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m

# Required by KSP: the KSP Gradle plugin registers its generated sources through
# the kotlin.sourceSets DSL, which AGP 9's built-in Kotlin disallows by default.
# This is the suppression AGP itself names in the error message; without it Room
# code generation cannot run. Remove it once KSP supports built-in Kotlin natively.
android.disallowKotlinSourceSets=false
